<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Kasku</title>
    <meta
      name="description"
      content="Catatan keuangan pribadi yang bekerja offline."
    />
    <meta name="theme-color" content="#0f6b5c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Kasku" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="toast"></div>
    <div id="vw" data-a="vc"></div>
    <div id="v"></div>
    <button id="fab" data-a="add">+</button>
    <nav id="nav"></nav>
    <div id="sh"><div id="shc"></div></div>
    <script src="app.js"></script>
    <script>
      if (
        "serviceWorker" in navigator &&
        location.protocol.startsWith("http")
      ) {
        addEventListener("load", () =>
          navigator.serviceWorker.register("sw.js").catch(() => {}),
        );
      }
    </script>
  </body>
</html>
